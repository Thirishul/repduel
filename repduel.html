<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RepDuel</title>
<style>
:root{--bg:#e8edf4;--ink:#14213d;--you:#1b6ef3;--ai:#f26b38;--card:#fff;--mut:#5b6b85}
@media(prefers-color-scheme:dark){:root{--bg:#0f1624;--ink:#eaf0fa;--card:#192236;--mut:#9aa9c4}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.screen{display:none;min-height:100%;padding:20px;max-width:560px;margin:auto;flex-direction:column;gap:18px}
.screen.on{display:flex}
h1{font-size:2.4rem;font-weight:800;letter-spacing:-.03em}
h2{font-size:1rem;font-weight:600;color:var(--mut)}
.seg{display:grid;grid-auto-flow:column;gap:8px}
.seg button,.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:14px;border-radius:12px;cursor:pointer}
.seg button.sel{background:var(--ink);color:var(--bg)}
.btn.main{background:var(--you);border-color:var(--you);color:#fff;font-size:1.15rem;padding:18px}
button:focus-visible{outline:3px solid var(--you);outline-offset:2px}
#stage{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:56vh;width:100%}
#stage video,#stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#hint{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:rgba(0,0,0,.55);color:#fff;font-size:.9rem;text-align:center}
#big{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:7rem;font-weight:800;color:#fff;background:rgba(0,0,0,.4)}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;font-variant-numeric:tabular-nums}
.score div{display:flex;flex-direction:column}
.score .n{font-size:4rem;font-weight:800;line-height:1}
.score .l{font-size:.85rem;color:var(--mut);font-weight:600}
.you .n{color:var(--you)}.ai .n{color:var(--ai);text-align:right}.ai .l{text-align:right}
#time{font-size:1.6rem;font-weight:800;padding-bottom:6px}
#bar{height:14px;border-radius:7px;background:var(--ai);overflow:hidden}
#bar i{display:block;height:100%;width:50%;background:var(--you);transition:width .3s}
#res h1{font-size:3rem}
.tip{font-size:.9rem;color:var(--mut);line-height:1.5}
</style>
</head>
<body>

<section id="home" class="screen on">
  <h1>RepDuel</h1>
  <h2>Exercise</h2>
  <div class="seg" id="exSeg"><button data-v="squat" class="sel">Squats</button><button data-v="pushup">Push-ups</button></div>
  <h2>Mode</h2>
  <div class="seg" id="modeSeg"><button data-v="solo" class="sel">Solo</button><button data-v="duel">Duel vs AI</button></div>
  <div id="aiOpt">
    <h2 style="margin-bottom:8px">AI level</h2>
    <div class="seg" id="lvSeg"><button data-v="0">Easy</button><button data-v="1" class="sel">Medium</button><button data-v="2">Hard</button></div>
  </div>
  <h2>Time</h2>
  <div class="seg" id="tSeg"><button data-v="30">30s</button><button data-v="60" class="sel">60s</button><button data-v="120">2 min</button></div>
  <button class="btn main" id="go">Start</button>
  <p class="tip" id="tipTxt"></p>
</section>

<section id="work" class="screen">
  <div class="score">
    <div class="you"><span class="l">You</span><span class="n" id="me">0</span></div>
    <span id="time">60</span>
    <div class="ai" id="aiBox"><span class="l">AI</span><span class="n" id="bot">0</span></div>
  </div>
  <div id="bar"><i id="barFill"></i></div>
  <div id="stage"><video id="vid" playsinline muted></video><canvas id="cv"></canvas><div id="big"></div><div id="hint">Loading pose model…</div></div>
  <button class="btn" id="quit">Stop</button>
</section>

<section id="res" class="screen">
  <h1 id="rTitle"></h1>
  <p id="rSub" style="font-size:1.2rem"></p>
  <button class="btn main" id="again">Play again</button>
  <button class="btn" id="home2">Home</button>
</section>

<script type="module">
import {PoseLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const $=id=>document.getElementById(id);
const cfg={ex:"squat",mode:"solo",lv:1,t:60};
const TIPS={squat:"Squats: stand 2 m from the phone so your full body, hips to ankles, is in frame. Front or side view works.",
            pushup:"Push-ups: prop the phone on the floor and face it sideways so the camera sees your whole body from the side."};
// reps per minute for the AI, by exercise and level
const AI_RPM={squat:[16,26,38],pushup:[12,20,30]};

function seg(id,key,num){
  $(id).addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b)return;
    [...$(id).children].forEach(x=>x.classList.toggle("sel",x===b));
    cfg[key]=num?+b.dataset.v:b.dataset.v; refresh();
  });
}
seg("exSeg","ex");seg("modeSeg","mode");seg("lvSeg","lv",1);seg("tSeg","t",1);
function refresh(){$("aiOpt").style.display=cfg.mode==="duel"?"block":"none";$("tipTxt").textContent=TIPS[cfg.ex];}
refresh();

function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));}

// ---------- pose ----------
let landmarker=null,stream=null,raf=0,lastVideoTime=-1;
async function loadModel(){
  if(landmarker)return;
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker=await PoseLandmarker.createFromOptions(fs,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"GPU"},
    runningMode:"VIDEO",numPoses:1});
}
const ang=(a,b,c)=>{
  const r=Math.atan2(c.y-b.y,c.x-b.x)-Math.atan2(a.y-b.y,a.x-b.x);
  let d=Math.abs(r*180/Math.PI); return d>180?360-d:d;
};
// joint triplets: [first, middle, last] landmark indices per side
const SIDES={squat:[[23,25,27],[24,26,28]],pushup:[[11,13,15],[12,14,16]]};
const TH={squat:{down:100,up:160},pushup:{down:90,up:155}};
const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];

// ---------- game state ----------
let running=false,reps=0,botReps=0,state="UP",smooth=null,endAt=0,botTimer=0,tick=0;

function vis(lm,t){return Math.min(lm[t[0]].visibility,lm[t[1]].visibility,lm[t[2]].visibility);}

function process(lm){
  // use the side whose joints the camera sees best
  const [l,r]=SIDES[cfg.ex]; const t=vis(lm,l)>=vis(lm,r)?l:r;
  if(vis(lm,t)<0.5){$("hint").textContent="Can't see your whole body. Step back or adjust the phone.";return;}
  $("hint").textContent=running?"Go!":"Ready";
  const a=ang(lm[t[0]],lm[t[1]],lm[t[2]]);
  smooth=smooth===null?a:smooth*0.6+a*0.4;       // smoothing: removes jitter
  const th=TH[cfg.ex];
  if(state==="UP"&&smooth<th.down) state="DOWN";                       // reached bottom
  else if(state==="DOWN"&&smooth>th.up){state="UP"; if(running)addRep();}  // back up = 1 rep
}
function addRep(){reps++;$("me").textContent=reps;updateBar();}
function updateBar(){
  if(cfg.mode!=="duel")return;
  const tot=reps+botReps; $("barFill").style.width=(tot?reps/tot*100:50)+"%";
}

function draw(lm){
  const cv=$("cv"),v=$("vid"); cv.width=v.videoWidth; cv.height=v.videoHeight;
  const g=cv.getContext("2d"); g.clearRect(0,0,cv.width,cv.height);
  g.lineWidth=5;g.strokeStyle="#4cc2ff";g.fillStyle="#fff";
  for(const[a,b]of BONES){
    if(lm[a].visibility<.5||lm[b].visibility<.5)continue;
    g.beginPath();g.moveTo(lm[a].x*cv.width,lm[a].y*cv.height);g.lineTo(lm[b].x*cv.width,lm[b].y*cv.height);g.stroke();
  }
}

function loop(){
  const v=$("vid");
  if(v.readyState>=2&&v.currentTime!==lastVideoTime){
    lastVideoTime=v.currentTime;
    const res=landmarker.detectForVideo(v,performance.now());
    if(res.landmarks&&res.landmarks[0]){draw(res.landmarks[0]);process(res.landmarks[0]);}
    else $("hint").textContent="No person found. Step into the frame.";
  }
  if(running){
    const left=Math.max(0,Math.ceil((endAt-Date.now())/1000)); $("time").textContent=left;
    if(left<=0)finish();
  }
  raf=requestAnimationFrame(loop);
}

// AI opponent: scores a rep every (60/RPM) seconds with random variation
function scheduleBot(){
  if(cfg.mode!=="duel"||!running)return;
  const gap=60/AI_RPM[cfg.ex][cfg.lv]*1000*(0.75+Math.random()*0.5);
  botTimer=setTimeout(()=>{if(!running)return;botReps++;$("bot").textContent=botReps;updateBar();scheduleBot();},gap);
}

async function start(){
  show("work");
  reps=0;botReps=0;state="UP";smooth=null;running=false;
  $("me").textContent=0;$("bot").textContent=0;$("time").textContent=cfg.t;$("barFill").style.width="50%";
  $("aiBox").style.visibility=$("bar").style.display=cfg.mode==="duel"?"visible":"hidden";
  $("bar").style.display=cfg.mode==="duel"?"block":"none";
  $("hint").textContent="Loading pose model…";
  try{
    await loadModel();
    if(!stream){
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640,height:480},audio:false});
      $("vid").srcObject=stream;
    }
    await $("vid").play();
  }catch(e){
    $("hint").textContent="Camera or model failed: "+(e.message||e)+". Use https or localhost and allow camera access.";
    return;
  }
  lastVideoTime=-1; cancelAnimationFrame(raf); loop();
  // 3-2-1 countdown, then go
  const big=$("big"); big.style.display="flex";
  for(const n of[3,2,1]){big.textContent=n;await new Promise(r=>setTimeout(r,1000));}
  big.style.display="none";
  endAt=Date.now()+cfg.t*1000; running=true; scheduleBot();
}

function finish(){
  running=false;clearTimeout(botTimer);cancelAnimationFrame(raf);
  $("vid").pause();
  let title="Done",sub=`${reps} ${cfg.ex==="squat"?"squats":"push-ups"} in ${cfg.t}s.`;
  if(cfg.mode==="duel"){
    title=reps>botReps?"You win":reps<botReps?"AI wins":"Draw";
    sub=`You ${reps} · AI ${botReps}`;
  }
  $("rTitle").textContent=title;$("rSub").textContent=sub;show("res");
}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}

$("go").onclick=start;
$("again").onclick=start;
$("quit").onclick=()=>{running=false;clearTimeout(botTimer);cancelAnimationFrame(raf);stopCamera();show("home");};
$("home2").onclick=()=>{stopCamera();show("home");};
</script>
</body>
</html>
